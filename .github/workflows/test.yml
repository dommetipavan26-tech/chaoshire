name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Trained-model drift check
        run: python -m chaoshire train --check
      - name: Test with coverage
        run: python -m pytest --cov=chaoshire --cov-report=term-missing --cov-report=json -q
      - name: Verify committed build facts
        run: python scripts/check_build_info.py --coverage-json coverage.json
