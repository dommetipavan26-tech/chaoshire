name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Select tested dependency constraints
        run: |
          version="${{ matrix.python-version }}"
          echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/constraints/requirements-py${version//./}.txt" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Repository files and assets
        # ubuntu-latest includes Node.js; the checker requires it for JS syntax.
        run: python scripts/check_repository.py --require-node --strict
      # numpy 2.5+ ships PEP 695 `type` statements in its stubs and requires
      # Python >= 3.12, so mypy's checked version has to follow the matrix leg:
      # the 3.11 leg resolves numpy 2.4.6 and checks 3.11 semantics, the 3.12 leg
      # resolves numpy 2.5.x and would otherwise fail to parse its stub.
      - name: Type check
        # mypy's own output is re-emitted as workflow annotations on failure so
        # the reason is visible on the PR page and through the checks API, not
        # only inside the raw job log.
        run: |
          set +e
          output="$(python -m mypy --python-version "${{ matrix.python-version }}" 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            printf '%s\n' "$output" | while IFS= read -r line; do
              if [ -n "$line" ]; then
                printf '::error title=mypy exit %s::%s\n' "$code" "$line"
              fi
            done
            echo "--- environment ---"
            python -VV
            python -m mypy --version
            python -m pip list 2>/dev/null | grep -Ei 'mypy|numpy|pandas|pydantic|fastapi|scikit|typing' || true
            ls -la
          fi
          exit "$code"
      - name: Trained-model drift check
        run: python -m chaoshire train --check
      - name: Test with coverage
        run: python -m pytest --cov=chaoshire --cov-report=term-missing --cov-report=json -q
      - name: Verify committed build facts
        run: python scripts/check_build_info.py --coverage-json coverage.json
      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify installed wheel, metadata and package data
        run: python scripts/check_distribution.py --wheel dist/chaoshire-*.whl --sdist dist/chaoshire-*.tar.gz --constraints "$PIP_CONSTRAINT"

  postgres-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chaoshire_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: chaoshire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chaoshire_test -d chaoshire_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Disposable CI service only; never use CHAOSHIRE_DATABASE_URL as test input.
      CHAOSHIRE_TEST_POSTGRES_URL: postgresql://chaoshire_test:isolated_ci_password@127.0.0.1:5432/chaoshire_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test and optional driver dependencies
        run: |
          version="${{ matrix.python-version }}"
          python -m pip install -c "constraints/requirements-py${version//./}.txt" -r requirements-dev.txt -r requirements-postgres.txt
      - name: Exercise real PostgreSQL schema, transactions and API
        run: >-
          python -m pytest tests/integration --require-postgres -q
          --cov=chaoshire.repository_postgres --cov-report=term-missing --cov-fail-under=90

  container-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build non-root image
        run: docker build -t chaoshire-ci .
      - name: Run on a non-default PORT and require healthy readiness
        run: |
          docker run -d --name chaoshire-ci -e PORT=8080 -p 127.0.0.1:8080:8080 chaoshire-ci
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' chaoshire-ci)"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then docker logs chaoshire-ci; exit 1; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' chaoshire-ci)" = "healthy"
          test "$(docker exec chaoshire-ci id -u)" = "10001"
          curl --fail http://127.0.0.1:8080/api/ready
          curl --fail http://127.0.0.1:8080/static/chaoshire.js
          curl --fail http://127.0.0.1:8080/privacy
      - name: Container logs and cleanup
        if: always()
        run: docker logs chaoshire-ci || true; docker rm -f chaoshire-ci || true
