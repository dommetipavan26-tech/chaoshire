name: Browser and mobile checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium (desktop + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: |
          set +e
          python -m pytest browser_tests -q -p no:cacheprovider --tb=line 2>&1 | tee browser-log.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Emit failures as check annotations so the Checks tab explains the red X
            # even when the raw job log is unavailable to the reviewer.
            {
              grep -E "^(FAILED|ERROR)" browser-log.txt || true
              grep -E "^E " browser-log.txt | head -20 || true
              tail -3 browser-log.txt | grep -E "failed|passed|error" || true
            } | sed -e 's/%/%25/g' -e 's/^/::error::/' | head -40
          fi
          exit "$status"

      - name: Capture portfolio screenshots
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python scripts/capture_portfolio.py --output portfolio-assets
      - name: Upload screenshots
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-screenshots
          path: portfolio-assets/*.png
          if-no-files-found: error
          retention-days: 30
