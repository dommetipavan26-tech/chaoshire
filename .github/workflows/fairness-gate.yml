name: Fairness release gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/requirements-py312.txt

jobs:
  fairness-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare candidate model with production baseline
        run: >-
          python -m chaoshire gate
          --baseline legacy
          --candidate trained
          --min-certificate 75
          --min-resilience 80
          --min-di 0.80
          --min-accuracy 0.80
          --min-holdout-mean-accuracy 0.78
          --min-holdout-p10-accuracy 0.70
          --min-holdout-mean-recall 0.90
          --min-holdout-p10-recall 0.80
          --max-holdout-mean-fpr 0.40
          --max-holdout-p90-fpr 0.50
          --min-holdout-p10-di 0.55
          --min-holdout-di-pass-rate 0.25
