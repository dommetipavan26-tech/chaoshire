[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "browser: live Chromium test that needs a running ChaosHire server",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["chaoshire"]
omit = ["chaoshire/data.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
