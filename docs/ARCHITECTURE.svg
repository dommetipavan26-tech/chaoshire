<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">ChaosHire architecture</title><desc id="d">Browser, FastAPI, fairness services, evidence outputs, storage, and delivery controls.</desc><style>text{font-family:system-ui,sans-serif;fill:#e5ecf8}.h{font-size:28px;font-weight:700}.s{font-size:16px}.b{fill:#121c30;stroke:#38bdf8;stroke-width:2}.g{fill:#16233c;stroke:#34d399;stroke-width:2}.a{stroke:#8fa1c2;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fa1c2"/></marker></defs><rect width="1200" height="720" fill="#0b1220"/><text x="60" y="60" class="h">ChaosHire v0.20.0 · evidence-first fairness engineering</text><rect x="60" y="110" rx="18" width="250" height="120" class="b"/><text x="90" y="155" class="h">Browser / PWA</text><text x="90" y="190" class="s">Dashboard · guided demo</text><rect x="470" y="110" rx="18" width="260" height="120" class="b"/><text x="520" y="155" class="h">FastAPI</text><text x="500" y="190" class="s">Validation · security · routes</text><line x1="310" y1="170" x2="465" y2="170" class="a"/><rect x="890" y="110" rx="18" width="250" height="120" class="g"/><text x="920" y="155" class="h">Operations</text><text x="920" y="190" class="s">Health · metrics · CI/CD</text><line x1="730" y1="170" x2="885" y2="170" class="a"/><rect x="90" y="330" rx="18" width="280" height="150" class="b"/><text x="120" y="375" class="h">Audit engine</text><text x="120" y="410" class="s">Metrics · confidence</text><text x="120" y="440" class="s">Intersections · adapters</text><rect x="460" y="330" rx="18" width="280" height="150" class="b"/><text x="500" y="375" class="h">Chaos Lab</text><text x="500" y="410" class="s">Counterfactual tests</text><text x="500" y="440" class="s">Candidate-level evidence</text><rect x="830" y="330" rx="18" width="280" height="150" class="b"/><text x="865" y="375" class="h">Review agent</text><text x="865" y="410" class="s">Risk prioritization</text><text x="865" y="440" class="s">Human action plan</text><line x1="600" y1="230" x2="230" y2="325" class="a"/><line x1="600" y1="230" x2="600" y2="325" class="a"/><line x1="600" y1="230" x2="970" y2="325" class="a"/><rect x="90" y="570" rx="18" width="280" height="100" class="g"/><text x="120" y="615" class="h">SQLite aggregates</text><text x="120" y="645" class="s">No raw-row history</text><rect x="460" y="570" rx="18" width="280" height="100" class="g"/><text x="500" y="615" class="h">Evidence</text><text x="500" y="645" class="s">SHA-256 · HTML · PDF</text><rect x="830" y="570" rx="18" width="280" height="100" class="g"/><text x="865" y="615" class="h">Release gate</text><text x="865" y="645" class="s">PASS / BLOCK in CI</text><line x1="230" y1="480" x2="230" y2="565" class="a"/><line x1="600" y1="480" x2="600" y2="565" class="a"/><line x1="970" y1="480" x2="970" y2="565" class="a"/></svg>