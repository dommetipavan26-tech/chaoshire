services:
  - type: web
    name: chaoshire
    runtime: docker
    plan: free
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: CHAOSHIRE_DB_PATH
        value: "/app/data/chaoshire.db"
      - key: CHAOSHIRE_MAX_BODY_BYTES
        value: "5500000"

      # --- write access -----------------------------------------------------
      # A real secret is generated at deploy time, not left unset. Holding it
      # makes an upload "published": it is written to the persistent audit
      # history and becomes the shared dataset=uploaded artifact. Operators and
      # CI send it as X-API-Key.
      - key: CHAOSHIRE_API_KEY
        generateValue: true

      # The public portfolio demo deliberately stays interactive, so anonymous
      # writes are allowed — but they are bounded and they are NOT published.
      # An anonymous upload is audited, returned to the caller, and discarded,
      # which removes the defacement path (an attacker-chosen audit name in the
      # history every visitor reads) without killing the demo.
      # Set this to "0" for a private deployment and writes require the key.
      - key: CHAOSHIRE_ALLOW_ANONYMOUS_WRITES
        value: "1"

      # --- rate limits ------------------------------------------------------
      # Non-zero by design. "0" disabled the limiter entirely, which on a 512 MB
      # free instance made unbounded POST traffic trivial.
      - key: CHAOSHIRE_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: CHAOSHIRE_WRITE_RATE_LIMIT_PER_MINUTE
        value: "6"

      # Render fronts the service with a trusted proxy; without this every
      # visitor would share one rate-limit bucket. Only the right-most
      # X-Forwarded-For entry is used, so a client cannot rotate the header.
      - key: CHAOSHIRE_TRUST_FORWARDED_FOR
        value: "1"

      # --- bounded demo state ----------------------------------------------
      # The appeal queue is a capped FIFO, not an unbounded in-memory list.
      # Anonymous entries are evicted before authenticated ones.
      - key: CHAOSHIRE_MAX_APPEALS
        value: "200"

      # Extra anonymous-appeal budget on top of the write limiter.
      - key: CHAOSHIRE_ANONYMOUS_APPEALS_PER_MINUTE
        value: "2"

      # Honest default: Render free storage is wiped on redeploy. Flip to "1"
      # only after attaching a persistent disk or pointing CHAOSHIRE_DB_PATH
      # at a managed database. Do not add a disk: entry while plan: free.
      - key: CHAOSHIRE_AUDIT_HISTORY_DURABLE
        value: "0"
